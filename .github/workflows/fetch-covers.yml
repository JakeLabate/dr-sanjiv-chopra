name: fetch-covers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p covers
          curl -sL -A "chopra-site-build" -o covers/brotherhood.jpg "https://covers.openlibrary.org/b/id/11363658-L.jpg"
          curl -sL -A "chopra-site-build" -o covers/two-most-important-days.jpg "https://covers.openlibrary.org/b/id/8881787-L.jpg"
          curl -sL -A "chopra-site-build" -o covers/coffee-the-magical-elixir.jpg "https://covers.openlibrary.org/b/id/14754664-L.jpg"
          curl -sL -A "chopra-site-build" -o covers/liver-book.jpg "https://covers.openlibrary.org/b/id/475780-L.jpg"
          file covers/*.jpg
      - run: |
          git config user.name "cover-fetch-bot"
          git config user.email "actions@github.com"
          git add covers
          git commit -m "Add self-hosted book covers"
          git push
