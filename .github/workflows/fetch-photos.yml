name: fetch-photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p photos-raw
          base="https://sanjivchopra.com/wp-content/uploads"
          for f in about-hero.jpg home-slider-2.jpg home-slider-3.jpg happiness-talk-slide.png namaste.png great-leaders.png live-better-live-longer-talk.png advances-in-medicine.png living-with-purpose.png microbiome.png mobile-home1-copy.jpg mobile-home-2.jpg mobile-home-3.jpg; do
            curl -sL -A "Mozilla/5.0 (site-build)" -o "photos-raw/$f" "$base/$f" || true
          done
          ls -la photos-raw
      - run: |
          git config user.name "photo-fetch-bot"
          git config user.email "actions@github.com"
          git add photos-raw
          git commit -m "Add raw photo candidates" || echo "nothing to commit"
          git push || true
